name: Pricing core checks

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build, test, and verify generated files
        run: npm run build && npm test && git diff --exit-code -- dist
      - name: Mandatory checks against the original change base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          WORK_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ "$WORK_BRANCH" != main ]; then
            BASE_SHA=$(git merge-base HEAD origin/main)
          fi
          python3 .github/mandatory.py --base "$BASE_SHA" --fix
          python3 .github/mandatory.py --base "$BASE_SHA"
          git diff --exit-code
